## General game settings, loaded from server.cfg with exec.

setr sv_showBusySpinnerOnLoadingScreen false

# Language of ai-* resources (locales/<lang>.json over the complete en.json base)
setr ai:locale "en"

# OneSync is set from the txAdmin settings page, not here
set game_enableFrameRateIndependentWheelPhysics true # vehicle physics independent of fps

