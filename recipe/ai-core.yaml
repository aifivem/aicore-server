$engine: 3
$minFxVersion: 38039
$onesync: on
name: ai-core
version: 0.2.0 # x-release-please-version
author: TGIANN
description: ai-core, a TypeScript FiveM framework with one admin panel for every script. ESX, QB and Qbox scripts run on it unchanged through its built-in bridge.

tasks:
  # The database: ai-core and every ai-* script create and update their own tables at start (no SQL to import)
  - action: connect_database

  # Server files: cfg templates and the files every install shares
  - action: download_github
    src: https://github.com/aifivem/aicore-server
    ref: main
    dest: ./tmp/server
    timeoutSeconds: 300

  - action: move_path
    src: ./tmp/server/security.cfg
    dest: ./security.cfg

  - action: move_path
    src: ./tmp/server/misc.cfg
    dest: ./misc.cfg

  - action: move_path
    src: ./tmp/server/permission.cfg
    dest: ./permission.cfg

  - action: move_path
    src: ./tmp/server/recipe/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/server/recipe/env.cfg
    dest: ./env.cfg

  - action: move_path
    src: ./tmp/server/env.example.cfg
    dest: ./env.example.cfg


  # Files for working on the server with an AI agent (skills, rules, tools, compatibility notes)
  - action: move_path
    src: ./tmp/server/.claude
    dest: ./.claude

  - action: move_path
    src: ./tmp/server/tools
    dest: ./tools

  - action: move_path
    src: ./tmp/server/docs/compat
    dest: ./docs/compat

  - action: move_path
    src: ./tmp/server/CLAUDE.md
    dest: ./CLAUDE.md

  - action: move_path
    src: ./tmp/server/AGENTS.md
    dest: ./AGENTS.md

  # License, slots, endpoints, the database and the server name into the cfg files
  - action: replace_string
    mode: all_vars
    file:
      - ./server.cfg
      - ./env.cfg

  # Third-party resources the server uses
  - action: download_github
    src: https://github.com/Bob74/bob74_ipl
    ref: master
    dest: ./resources/[standalone]/bob74_ipl

  # ai-core and its 40 scripts in one zip: each one's latest release, built and ready (no build tools needed), with its source
  - action: download_file
    url: https://github.com/aifivem/aicore-server/releases/download/scripts/ai-scripts.zip
    path: ./tmp/ai-scripts.zip
    timeoutSeconds: 600

  - action: ensure_dir
    path: ./resources

  - action: unzip
    src: ./tmp/ai-scripts.zip
    dest: ./resources

  # Clean up
  - action: remove_path
    path: ./tmp
