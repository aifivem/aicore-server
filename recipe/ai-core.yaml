$engine: 3
$onesync: on
name: ai-core
version: 0.1.0
author: TGIANN
description: ai-core, a TypeScript FiveM framework with one admin panel for every script. ESX, QB and Qbox scripts run on it unchanged through its built-in bridge.

tasks:
  # The database: ai-core and every ai-* script create and update their own tables at start (no SQL to import)
  - action: connect_database

  # Server files: cfg templates and the files every install shares
  - action: download_github
    src: https://github.com/TGIANN/aicore-server
    ref: main
    dest: ./tmp/server

  - action: move_path
    src: ./tmp/server/security.cfg
    dest: ./security.cfg

  - action: move_path
    src: ./tmp/server/misc.cfg
    dest: ./misc.cfg

  - action: move_path
    src: ./tmp/server/permission.cfg
    dest: ./permission.cfg

  - action: move_path
    src: ./tmp/server/recipe/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/server/recipe/env.cfg
    dest: ./env.cfg

  - action: move_path
    src: ./tmp/server/env.example.cfg
    dest: ./env.example.cfg

  # License, slots, endpoints, the database and the server name into the cfg files
  - action: replace_string
    mode: all_vars
    file:
      - ./server.cfg
      - ./env.cfg

  # ai-core and its scripts: each is its own repository with its build committed (no build tools needed)
  - action: download_github
    src: https://github.com/TGIANN/ai-mysql
    ref: main
    dest: ./resources/[ai]/ai-mysql

  - action: download_github
    src: https://github.com/TGIANN/ai-core
    ref: main
    dest: ./resources/[ai]/ai-core

  - action: download_github
    src: https://github.com/TGIANN/ai-loading
    ref: main
    dest: ./resources/[ai]/ai-loading

