# ai-core server config. Docs: https://docs.fivem.net/docs/server-manual/server-commands/
# Secrets and machine-specific values live in env.cfg (copy env.example.cfg).
# Never put ";" in a comment here: FXServer treats it as a command separator even after "#".

## Server identity
# Server list name, description, tags, language, banners and Discord link are set at https://portal.cfx.re/,
# not here: sv_projectName, sv_projectDesc, tags, locale, banner_detail and banner_connecting are no longer read.
sv_hostname "{{serverName}}"

## Game build (startup only)
sv_enforceGameBuild 3751

exec env.cfg
set resources_useSystemChat false

## Config files
exec security.cfg
exec misc.cfg

## Resources: libraries first
ensure ai-mysql # database engine, stands in for oxmysql (also mysql-async, ghmattimysql) for third-party scripts

## ai-core resources (each one is its own git repo under resources/[ai])
ensure ai-core
ensure ai-loading # loading screen: server brand, progress, tips from the panel
ensure ai-voice # proximity voice, radio, phone calls (Legacy and Enhanced), stands in for pma-voice
ensure ai-lib # the lib for JavaScript resources without a bundler (@ai-lib/dist/client.js, server.js)
ensure ai-appearance # character creator, clothing shops, barbers
ensure ai-inventory # grid inventory, stands in for ox_inventory and qb-inventory
ensure ai-chat # chat with channels and command suggestions, stands in for chat
ensure ai-hud # HUD and needs (hunger, thirst, stress)
ensure ai-vehicles # owned vehicles, stands in for qbx_vehicles
ensure ai-vehiclekeys # keys, locks, lockpicking, stands in for qbx_vehiclekeys
ensure ai-fuel # fuel use and gas stations
ensure ai-garages # garages, job fleets, impound
ensure ai-vehicleshop # vehicle shops
ensure ai-banking # banks, ATMs, society accounts
ensure ai-death # death, hospitals, EMS revive
ensure ai-police # police menu, cuffs, fines, shot alerts
ensure ai-policealert # police alert cards for on-duty officers (built-in alert system of ai-core's dispatch layer)
ensure ai-prison # jail sentences counted by the server, prison work, canteen, escape check
ensure ai-doorlock # door locks
ensure ai-weathersync # time and weather
ensure ai-radialmenu # radial menu
ensure ai-scoreboard # scoreboard
ensure ai-cityhall # job center and documents
ensure ai-management # boss menu
ensure ai-jobs # work routes: taxi, bus, trucker, garbage, gathering
ensure ai-mechanic # repair, tuning with preview, car washes, repair kit
ensure ai-robberies # stores, banks, jewelery
ensure ai-pawnshop # pawnshops and scrapyards
ensure ai-smallresources # seatbelt, cruise, crouch, tackle, binoculars, fireworks, teleports, AFK
ensure ai-drugs # street sales and weed plants
ensure ai-exitsleeping # logged-out players stay in the world as sleeping bodies
ensure ai-lapraces # lap races and best times
ensure ai-properties # houses and apartments
ensure ai-target # markers on what the player can interact with, stands in for ox_target
ensure ai-admin # admin tools: noclip, teleports, heal, revive, vehicles, quick menu (F9)
ensure ai-rental # vehicle rental points: fee, deposit back on return, keys and fuel through ai-core
ensure ai-pedscale # character height and width set by admins, limits in the panel
ensure ai-sirens # emergency vehicle lights, siren tones, airhorn, ONX lightbars

## Permissions
exec permission.cfg
