## Permissions (ACE / principals), loaded from server.cfg with exec.

## Groups
add_ace group.admin command allow # allow all commands
add_ace group.admin command.quit deny # but not quit
add_ace group.admin ai.admin allow # full admin: every admin panel permission (ai-core)

## Resources that run ACL commands (ai-core mirrors roles, jobs and gangs into principals)
add_ace resource.ai-core command.add_principal allow
add_ace resource.ai-core command.remove_principal allow
# addCommand grants command.<name> to the principals a restricted command lists (group.admin and the like)
add_ace resource.ai-core command.add_ace allow
add_ace resource.ai-core command.remove_ace allow
# ai-admin's /addpermission and /removepermission
add_ace resource.ai-admin command.add_principal allow
add_ace resource.ai-admin command.remove_principal allow

## System admins (identifier.fivem:<id>, identifier.license:<hash>, ...)
add_principal identifier.fivem:348089 group.admin #TGIANN
add_principal identifier.fivem:8514511 group.admin #LUMI
