# Copy this file to env.cfg and fill in the values.
# env.cfg is not in git. server.cfg loads it with exec.
# Secrets use "set" (server only), never "setr" or "sets" (those reach clients / the server list).

sv_licenseKey "cfxk_XXXXXXXXXXXXXXXXXXXX"
sv_maxclients 8
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
set steam_webApiKey ""

# Blocks modified client files. 1: allows audio and known graphics mods, 2: blocks all.
# Comment it out on a test machine if needed.
set sv_pureLevel 1

# Database (MariaDB). ai-mysql serves third-party scripts (it stands in for oxmysql); every ai-* resource that uses
# the database opens its own small pool and needs a read permission line below.
set mysql_connection_string "mysql://user:password@localhost/ai_core?charset=utf8mb4"
# Only these resources may read the connection string
add_convar_permission ai-mysql read mysql_connection_string
add_convar_permission ai-core read mysql_connection_string
add_convar_permission ai-appearance read mysql_connection_string

# RCON (UDP, game port), used by tools/rcon.ts. Empty = RCON off. Set it only on development servers.
set rcon_password ""

# Developer mode (resmon and dev commands on FiveM for GTAV Enhanced). Development servers only.
# set sv_devMode true
