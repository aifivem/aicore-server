## Security settings, loaded from server.cfg with exec.
## Reference: https://docs.fivem.net/docs/server-manual/server-commands/ and docs/research/fivem-docs.md "Security".
## Every ai-core resource is written for these values. Do not loosen them to make a script work: adapt the script.

# Identity
set sv_scriptHookAllowed false # block clients running ScriptHookV
set sv_authMaxVariance 5 # 1-5, lower = identity providers whose ids change less
set sv_authMinTrust 5 # 1-5, higher = identities that are harder to spoof

# HTTP flood / proxy protection
set sv_requestParanoia 2

# Network event routing: events commonly abused by cheats are not routed
set sv_enableNetworkedSounds false # NETWORK_PLAY_SOUND_EVENT
set sv_enableNetworkedPhoneExplosions false # REQUEST_PHONE_EXPLOSION_EVENT
set sv_enableNetworkedScriptEntityStates false # SCRIPT_ENTITY_STATE_CHANGE_EVENT
set sv_filterRequestControl 4 # REQUEST_CONTROL_EVENT is never routed

# Entity lockdown: vehicles, peds and objects are created on the server only
# strict: every client-created entity is blocked | relaxed: only script entities | inactive: no limit
set sv_entityLockdown strict

# Only the server may change state bags (clients cannot replicate LocalPlayer.state:set(k, v, true))
setr sv_stateBagStrictMode true

# Net game events a client can fire at other players or entities. The server is authoritative, so these
# actions are done from the server. List: https://docs.fivem.net/docs/game-references/net-game-events/
# Explosions and particles (EXPLOSION_EVENT, NETWORK_PTFX_EVENT) are filtered by server event handlers instead.
block_net_game_event "GIVE_WEAPON_EVENT" # give a weapon to someone else
block_net_game_event "REMOVE_WEAPON_EVENT" # take a weapon from someone else
block_net_game_event "REMOVE_ALL_WEAPONS_EVENT" # take all weapons from someone else
block_net_game_event "NETWORK_CLEAR_PED_TASKS_EVENT" # pull out of vehicles / freeze
block_net_game_event "RAGDOLL_REQUEST_EVENT" # knock someone down
block_net_game_event "GIVE_PED_SCRIPTED_TASK_EVENT" # force a task on someone else
block_net_game_event "GIVE_PED_SEQUENCE_TASK_EVENT" # force a task sequence on someone else
block_net_game_event "ALTER_WANTED_LEVEL_EVENT" # give someone a wanted level
block_net_game_event "CLEAR_AREA_EVENT" # delete entities in an area
block_net_game_event "CLEAR_RECTANGLE_AREA_EVENT" # delete entities in a rectangle
block_net_game_event "BLOW_UP_VEHICLE_EVENT" # blow up someone else's vehicle
block_net_game_event "KICK_VOTES_EVENT" # GTA Online kick vote
block_net_game_event "NETWORK_START_PED_ARREST_EVENT" # GTA Online cuffing
block_net_game_event "NETWORK_START_PED_UNCUFF_EVENT" # GTA Online uncuffing
block_net_game_event "BLOCK_WEAPON_SELECTION" # lock weapon selection in a vehicle
